[package]
name = "critical_zoomer"
version = "0.0.11"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

#################################################################################################


[dependencies]
clap = "4.5.45"
eframe = "0.32.3"
egui = "0.32.3"
#egui_extras = "0.32.1"
#env_logger = "0.11.8"
rand = "0.9.2"
rug = "1.27.0"
steady_state = "0.2.13"
winit = "0.30.12"
#num_cpus = "1.17.0"
egui_dnd = "0.13.0"
num-traits = "0.2.19"
proptest = "1.11.0"
arboard = "3.6"
wgpu = "25.0.2"
v4l = "0.14"
bytemuck = { version = "1.22", features = ["derive"] }
pollster = "1.0.1"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
[[bench]]
name = "my_bench"
harness = false

[[bench]]
name = "workgroup_fitness"
harness = false

[[bench]]
name = "shadergroup_fitness"
harness = false

[lib]
bench = false

[[bin]]
name = "critical_zoomer"
path = "src/main.rs"
bench = false

# House tests are `cargo test` (dev/test): overflow checks and
# debug-assertions stay on. opt-level 3 so cadence/IPS floors see a
# product-speed compile. `cargo test --release` turns those checks off —
# do not use it as the gate. Criterion benches still use profile.release.
# Mutants: do **not** inherit that opt-3 — thousands of incremental compiles
# need a cheap profile (`cargo mutants` uses `--profile=mutants`).
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.mutants]
inherits = "test"
opt-level = 0
debug = 0
