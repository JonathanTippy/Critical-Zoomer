doc = false
bench = false

[[bin]]
name = "fuzz_coords_parse"
path = "fuzz_targets/fuzz_coords_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_publisher_clamp"
path = "fuzz_targets/fuzz_publisher_clamp.rs"
test = false
doc = false
bench = false
