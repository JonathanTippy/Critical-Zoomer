edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rug = "1.27.0"

[dependencies.critical_zoomer]
path = ".."

[[bin]]
name = "fuzz_target_1"
